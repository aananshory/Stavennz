
<!DOCTYPE html>
<html>
<head>
    <title>Input Data Mahasiswa</title>
</head>
<body>
    <h2>Input Data Mahasiswa</h2>

    <label>Nama:</label><br>
    <input type="text" id="nama"
           placeholder="Masukkan nama"><br><br>

    <label>NIM:</label><br>
    <input type="text" id="nim"
           placeholder="Masukkan NIM"><br><br>

    <label>Umur:</label><br>
    <input type="number" id="umur"
           placeholder="Masukkan umur"><br><br>

    <label>Status Mahasiswa:</label><br>
    <select id="status">
        <option value="Aktif">Aktif</option>
        <option value="Tidak Aktif">Tidak Aktif</option>
    </select><br><br>

    <label>Nilai:</label><br>
    <input type="number" id="nilai"
           placeholder="Masukkan nilai"><br><br>

    <button onclick="tampilkanData()">Simpan Data</button>

    <h3>Hasil Data Mahasiswa</h3>
    <p id="hasil"></p>

    <script>
        function tampilkanData() {
            // Mengambil data dan menyimpannya dalam variabel
            let nama = document.getElementById("nama").value;
            let nim = document.getElementById("nim").value;
            let umur = Number(document.getElementById("umur").value);
            let statusMahasiswa =
                document.getElementById("status").value;
            let nilai = Number(document.getElementById("nilai").value);

            // Menampilkan data
            document.getElementById("hasil").innerHTML =
                "Nama: " + nama + "<br>" +
                "NIM: " + nim + "<br>" +
                "Umur: " + umur + " tahun<br>" +
                "Status: " + statusMahasiswa + "<br>" +
                "Nilai: " + nilai;
        }
    </script>
</body>
      </html>
